name: Plugin CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build runtime and demo
        run: |
          dotnet build addons/fairygui/FairyGUI.csproj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build FairyGUIForGodot.csproj
      - name: Install Godot .NET
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $name = 'Godot_v4.7.2-stable_mono_win64'
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$name.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA512).Hash -ne '79229fd112b0c9cbeab82363a4ef7be18ea70f1caf86bf912789335b136fbe7e01db0053a33461438c5da1c680c17bbb10040bd09bedc51221cd4423d0367757') {
            throw 'Unexpected Godot archive checksum'
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          "GODOT=$env:RUNNER_TEMP/$name/${name}_console.exe" >> $env:GITHUB_ENV
      - name: Import resources and run smoke tests
        run: |
          & $env:GODOT --headless --path . --import
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $output = & $env:GODOT --headless --path . res://tests/SmokeTest.tscn
          $exitCode = $LASTEXITCODE
          $output
          if ($exitCode) { exit $exitCode }
          if (-not ($output -match '\[SMOKE\] checks: [1-9]\d*, failed checks: 0')) {
            throw 'Missing successful smoke test summary'
          }
